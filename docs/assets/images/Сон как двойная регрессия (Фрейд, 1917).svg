<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" width="1600" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Сон как соматическая и психологическая регрессия</title>
  <desc id="desc">
    Двойная регрессия сна: соматическая — воспроизведение внутриутробного существования;
    психологическая — почти полный уход от окружающего мира.
  </desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap');

      :root {
        --surface: #EFE2D8;
        --surface-2: #E9D0C1;
        --ink: #2A1F2D;
        --bruise: #6B3B4F;
      }

      .row rect.card { fill: var(--surface-2); stroke: none; }
      .row rect.chip { fill: var(--bruise); }
      .row .chip-text {
        fill: var(--surface);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 40px;
        font-weight: 600;
        text-anchor: middle;
      }
      .row .body-text {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 44px;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1600" height="820" fill="#EFE2D8"/>

  <!-- Соматический -->
  <g class="row" transform="translate(80 60)">
    <rect class="card" width="1440" height="340" rx="26" ry="26"/>
    <rect class="chip" x="40" y="135" width="380" height="70" rx="16" ry="16"/>
    <text class="chip-text" x="230" y="182">Соматический</text>
    <text class="body-text" x="470" y="90">
      <tspan x="470" dy="0">воспроизводит внутриутробное</tspan>
      <tspan x="470" dy="58">существование — покой, тепло,</tspan>
      <tspan x="470" dy="58">отсутствие раздражений (поза</tspan>
      <tspan x="470" dy="58">зародыша у многих спящих)</tspan>
    </text>
  </g>

  <!-- Психологический -->
  <g class="row" transform="translate(80 460)">
    <rect class="card" width="1440" height="280" rx="26" ry="26"/>
    <rect class="chip" x="40" y="105" width="480" height="70" rx="16" ry="16"/>
    <text class="chip-text" x="280" y="152">Психологический</text>
    <text class="body-text" x="570" y="110">
      <tspan x="570" dy="0">почти полный уход от</tspan>
      <tspan x="570" dy="58">окружающего мира, утрата</tspan>
      <tspan x="570" dy="58">интереса к нему</tspan>
    </text>
  </g>
</svg>
