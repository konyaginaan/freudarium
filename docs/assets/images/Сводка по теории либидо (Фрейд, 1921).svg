<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Сводка по теории либидо — влюблённость, гипноз, масса</title>
  <desc id="desc">
    Три состояния выстроены по двум переменным: характеру влечений и месту объекта,
    плюс число лиц. Гипноз и масса — заторможенные по цели влечения, объект на месте
    Я-идеала; в массе к этому добавляется идентификация членов друг с другом.
  </desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap');

      :root {
        --surface: #EFE2D8;
        --surface-2: #E9D0C1;
        --ink: #2A1F2D;
        --ink-muted: #6B5F63;
      }

      .cell rect { fill: var(--surface-2); stroke: none; }
      .cell text {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 32px;
        font-weight: 500;
      }
      .col-header {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 36px;
        font-weight: 600;
        text-anchor: middle;
      }
      .row-label {
        fill: var(--ink-muted);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 38px;
        font-style: italic;
        font-weight: 600;
        text-anchor: end;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#EFE2D8"/>

  <text class="col-header" x="510" y="70">
    <tspan x="510" dy="0">На каких</tspan>
    <tspan x="510" dy="42">влечениях</tspan>
  </text>
  <text class="col-header" x="980" y="70">
    <tspan x="980" dy="0">Куда становится</tspan>
    <tspan x="980" dy="42">объект</tspan>
  </text>
  <text class="col-header" x="1370" y="90">Число лиц</text>

  <!-- Влюблённость -->
  <text class="row-label" x="245" y="200" font-size="35">Влюблённость</text>
  <g class="cell" transform="translate(260 150)">
    <rect width="500" height="280" rx="20" ry="20"/>
    <text x="30" y="66">
      <tspan x="30" dy="0">одновременно прямые</tspan>
      <tspan x="30" dy="42">и заторможенные по</tspan>
      <tspan x="30" dy="42">цели; притягивает часть</tspan>
      <tspan x="30" dy="42">нарциссического</tspan>
      <tspan x="30" dy="42">Я-либидо</tspan>
    </text>
  </g>
  <g class="cell" transform="translate(780 150)">
    <rect width="440" height="280" rx="20" ry="20"/>
    <text x="30" y="66">рядом с Я</text>
  </g>
  <g class="cell" transform="translate(1240 150)">
    <rect width="310" height="280" rx="20" ry="20"/>
    <text x="30" y="66">
      <tspan x="30" dy="0">место только</tspan>
      <tspan x="30" dy="42">для Я и объекта</tspan>
    </text>
  </g>

  <!-- Гипноз -->
  <text class="row-label" x="240" y="500">Гипноз</text>
  <g class="cell" transform="translate(260 460)">
    <rect width="500" height="160" rx="20" ry="20"/>
    <text x="30" y="66">
      <tspan x="30" dy="0">всецело</tspan>
      <tspan x="30" dy="42">заторможенные</tspan>
    </text>
  </g>
  <g class="cell" transform="translate(780 460)">
    <rect width="440" height="160" rx="20" ry="20"/>
    <text x="30" y="90">на место Я-идеала</text>
  </g>
  <g class="cell" transform="translate(1240 460)">
    <rect width="310" height="160" rx="20" ry="20"/>
    <text x="30" y="90">те же два лица</text>
  </g>

  <!-- Масса -->
  <text class="row-label" x="240" y="750">Масса</text>
  <g class="cell" transform="translate(260 660)">
    <rect width="500" height="180" rx="20" ry="20"/>
    <text x="30" y="76">
      <tspan x="30" dy="0">заторможенные</tspan>
      <tspan x="30" dy="42">по цели</tspan>
    </text>
  </g>
  <g class="cell" transform="translate(780 660)">
    <rect width="440" height="180" rx="20" ry="20"/>
    <text x="30" y="56">
      <tspan x="30" dy="0">на место Я-идеала +</tspan>
      <tspan x="30" dy="42">идентификация</tspan>
      <tspan x="30" dy="42">членов друг с другом</tspan>
    </text>
  </g>
  <g class="cell" transform="translate(1240 660)">
    <rect width="310" height="180" rx="20" ry="20"/>
    <text x="30" y="90">многие</text>
  </g>
</svg>
