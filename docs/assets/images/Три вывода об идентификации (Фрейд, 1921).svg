<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1150" width="1600" height="1150" role="img" aria-labelledby="title desc">
  <title id="title">Три вывода об идентификации</title>
  <desc id="desc">
    Три положения об идентификации из трёх источников: первоначальная форма чувственной
    связи, регрессивная замена объектной связи, возникновение при всякой общности
    с лицом вне сексуальных влечений.
  </desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&amp;family=JetBrains+Mono:wght@400&amp;display=swap');

      :root {
        --surface: #EFE2D8;
        --surface-2: #E9D0C1;
        --ink: #2A1F2D;
        --ink-muted: #6B5F63;
        --bruise: #6B3B4F;
      }

      .row rect.card { fill: var(--surface-2); stroke: none; }
      .row rect.plaque { fill: var(--bruise); }
      .row .plaque-text {
        fill: var(--surface);
        font-family: "JetBrains Mono", monospace;
        font-size: 40px;
        text-anchor: middle;
      }
      .row .item-title {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 40px;
        font-weight: 600;
      }
      .row .item-example {
        fill: var(--ink-muted);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 36px;
        font-style: italic;
        font-weight: 500;
      }
    </style>
  </defs>

  <rect width="1600" height="1150" fill="#EFE2D8"/>

  <!-- 1 -->
  <g class="row" transform="translate(50 40)">
    <rect class="card" width="1500" height="320" rx="26" ry="26"/>
    <rect class="plaque" x="32" y="32" width="90" height="90" rx="16" ry="16"/>
    <text class="plaque-text" x="77" y="86">1</text>
    <text class="item-title" x="152" y="86">
      <tspan x="152" dy="0">Идентификация — самая</tspan>
      <tspan x="152" dy="50">первоначальная форма</tspan>
      <tspan x="152" dy="50">чувственной связи с объектом</tspan>
    </text>
    <text class="item-example" x="152" y="270">мальчик берёт отца за идеал</text>
  </g>

  <!-- 2 -->
  <g class="row" transform="translate(50 400)">
    <rect class="card" width="1500" height="320" rx="26" ry="26"/>
    <rect class="plaque" x="32" y="32" width="90" height="90" rx="16" ry="16"/>
    <text class="plaque-text" x="77" y="86">2</text>
    <text class="item-title" x="152" y="86">
      <tspan x="152" dy="0">Регрессивно становится заменой</tspan>
      <tspan x="152" dy="50">либидинозной связи — как бы</tspan>
      <tspan x="152" dy="50">интроекцией объекта в Я</tspan>
    </text>
    <text class="item-example" x="152" y="270">кашель Доры, скопированный у отца</text>
  </g>

  <!-- 3 -->
  <g class="row" transform="translate(50 760)">
    <rect class="card" width="1500" height="320" rx="26" ry="26"/>
    <rect class="plaque" x="32" y="32" width="90" height="90" rx="16" ry="16"/>
    <text class="plaque-text" x="77" y="86">3</text>
    <text class="item-title" x="152" y="86">
      <tspan x="152" dy="0">Может возникнуть при всякой</tspan>
      <tspan x="152" dy="50">общности с лицом вне сексуальных</tspan>
      <tspan x="152" dy="50">влечений</tspan>
    </text>
    <text class="item-example" x="152" y="270">припадок, перенятый подругами по пансиону</text>
  </g>
</svg>
