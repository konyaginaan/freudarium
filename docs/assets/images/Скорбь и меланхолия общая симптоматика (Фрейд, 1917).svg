<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 750" width="1600" height="750" role="img" aria-labelledby="title desc">
  <title id="title">Скорбь и меланхолия — совпадающая картина</title>
  <desc id="desc">
    Четыре черты, в которых скорбь и меланхолия совпадают почти полностью: болезненно
    подавленное настроение, утрата интереса к внешнему миру, утрата способности любить,
    заторможенность активности.
  </desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap');

      :root {
        --surface: #EFE2D8;
        --surface-2: #E9D0C1;
        --ink: #2A1F2D;
        --bruise: #6B3B4F;
      }

      .row rect.card { fill: var(--surface-2); stroke: none; }
      .row rect.chip { fill: var(--bruise); }
      .row .chip-text {
        fill: var(--surface);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 38px;
        font-weight: 600;
        text-anchor: middle;
      }
      .row .body-text {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 42px;
        font-weight: 500;
        text-anchor: middle;
      }
    </style>
  </defs>

  <rect width="1600" height="750" fill="#EFE2D8"/>

  <!-- Настроение -->
  <g class="row" transform="translate(60 60)">
    <rect class="card" width="710" height="280" rx="24" ry="24"/>
    <rect class="chip" x="30" y="30" width="300" height="80" rx="16" ry="16"/>
    <text class="chip-text" x="180" y="80">Настроение</text>
    <text class="body-text" x="355" y="200">
      <tspan x="355" dy="0">болезненно</tspan>
      <tspan x="355" dy="56">подавленное</tspan>
    </text>
  </g>

  <!-- Интерес к внешнему миру -->
  <g class="row" transform="translate(830 60)">
    <rect class="card" width="710" height="280" rx="24" ry="24"/>
    <rect class="chip" x="30" y="30" width="470" height="80" rx="16" ry="16"/>
    <text class="chip-text" x="265" y="80">Интерес к внешнему миру</text>
    <text class="body-text" x="355" y="220">утрачен</text>
  </g>

  <!-- Способность любить -->
  <g class="row" transform="translate(60 410)">
    <rect class="card" width="710" height="280" rx="24" ry="24"/>
    <rect class="chip" x="30" y="30" width="420" height="80" rx="16" ry="16"/>
    <text class="chip-text" x="240" y="80">Способность любить</text>
    <text class="body-text" x="355" y="220">утрачена</text>
  </g>

  <!-- Активность -->
  <g class="row" transform="translate(830 410)">
    <rect class="card" width="710" height="280" rx="24" ry="24"/>
    <rect class="chip" x="30" y="30" width="300" height="80" rx="16" ry="16"/>
    <text class="chip-text" x="180" y="80">Активность</text>
    <text class="body-text" x="355" y="220">заторможена</text>
  </g>
</svg>
