<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="title desc">
  <title id="title">Гипноз — массообразование вдвоём</title>
  <desc id="desc">
    Влюблённость, гипноз и масса выстроены по двум переменным: сохранены ли прямые
    сексуальные цели и сколько участников. Гипноз занимает середину — сексуальные цели
    исключены, как в массе, но участников двое, как во влюблённости.
  </desc>

  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;0,600;1,500&amp;display=swap');

      :root {
        --surface: #EFE2D8;
        --surface-2: #E9D0C1;
        --flesh: #C08B7A;
        --ink: #2A1F2D;
        --ink-muted: #6B5F63;
        --bruise: #6B3B4F;
      }

      .cell rect { fill: var(--surface-2); stroke: none; }
      .cell.accent rect { fill: var(--flesh); }
      .cell text {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 48px;
        font-weight: 500;
        text-anchor: middle;
      }
      .col-header {
        fill: var(--ink);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 52px;
        font-weight: 600;
        text-anchor: middle;
      }
      .row-label {
        fill: var(--ink-muted);
        font-family: "EB Garamond", Georgia, serif;
        font-size: 48px;
        font-style: italic;
        font-weight: 500;
        text-anchor: end;
      }
      .row-label.accent {
        fill: var(--bruise);
        font-style: normal;
        font-weight: 600;
      }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#EFE2D8"/>

  <!-- Заголовки колонок -->
  <text class="col-header" x="690" y="150">
    <tspan x="690" dy="0">Прямые</tspan>
    <tspan x="690" dy="60">сексуальные цели</tspan>
  </text>
  <text class="col-header" x="1290" y="180">Число участников</text>

  <!-- Влюблённость -->
  <text class="row-label" x="350" y="335">Влюблённость</text>
  <g class="cell" transform="translate(410 285)">
    <rect width="560" height="130" rx="20" ry="20"/>
    <text x="280" y="82">сохранены (отодвинуты)</text>
  </g>
  <g class="cell" transform="translate(1010 285)">
    <rect width="560" height="130" rx="20" ry="20"/>
    <text x="280" y="82">двое</text>
  </g>

  <!-- Гипноз (акцент) -->
  <text class="row-label accent" x="350" y="500">Гипноз</text>
  <g class="cell accent" transform="translate(410 450)">
    <rect width="560" height="130" rx="20" ry="20"/>
    <text x="280" y="82">исключены</text>
  </g>
  <g class="cell accent" transform="translate(1010 450)">
    <rect width="560" height="130" rx="20" ry="20"/>
    <text x="280" y="82">двое</text>
  </g>

  <!-- Масса -->
  <text class="row-label" x="350" y="665">Масса</text>
  <g class="cell" transform="translate(410 615)">
    <rect width="560" height="130" rx="20" ry="20"/>
    <text x="280" y="82">исключены</text>
  </g>
  <g class="cell" transform="translate(1010 615)">
    <rect width="560" height="130" rx="20" ry="20"/>
    <text x="280" y="82">многие</text>
  </g>
</svg>
