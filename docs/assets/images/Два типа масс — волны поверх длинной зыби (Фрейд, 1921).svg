  <!-- якорь: дата -->
  <g transform="translate(80 70)">
    <rect width="230" height="112" rx="20" fill="var(--bruise)"/>
    <text x="115" y="74" text-anchor="middle" fill="var(--surface)" font-size="54" font-weight="600">1921</text>
    <text x="260" y="72" fill="var(--ink)" font-size="46" font-weight="500" font-style="italic">Фрейд, «Групповая психология»</text>
  </g>

  <!-- верхняя подпись: короткие массы -->
  <g transform="translate(1560 280)">
    <text x="0" y="0" text-anchor="end" fill="var(--ink)" font-size="66" font-weight="600">
      <tspan x="0" dy="0">Кратковременные</tspan>
      <tspan x="0" dy="76">массы</tspan>
    </text>
    <text x="0" y="150" text-anchor="end" fill="var(--ink-muted)" font-size="46" font-weight="500" font-style="italic">
