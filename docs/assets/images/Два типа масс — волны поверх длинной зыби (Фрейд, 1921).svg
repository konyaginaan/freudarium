<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050"
     role="img" aria-labelledby="title desc">
  <title id="title">Два типа масс — волны поверх длинной зыби</title>
  <desc id="desc">
    Кратковременные массы — короткие высокие волны — идут поверх длинной пологой зыби
    устойчивых сообществ и институтов; мимолётное вспыхивает на теле устойчивого.
  </desc>

