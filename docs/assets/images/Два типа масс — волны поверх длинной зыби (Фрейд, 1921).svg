        --flesh: #C08B7A;
        --ink: #2A1F2D;
        --ink-muted: #6B5F63;
        --bruise: #6B3B4F;
      }
    </style>
    <clipPath id="frame"><rect x="0" y="0" width="1600" height="900"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="#EFE2D8"/>

